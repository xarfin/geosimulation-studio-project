<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Schiehaven Noord | Layers</title>
  </head>
  <body>
    <a class="skip-link" href="#pagePanel">Skip to layer controls</a>
    <header class="topbar" id="projectHeader"></header>
    <main class="workspace">
      <section aria-label="Study-area layers" class="map-pane">
        <div aria-label="Interactive study-area map" class="map-canvas" id="cesiumContainer"></div>
      </section>
      <aside aria-labelledby="pageTitle" class="app-panel layers-panel" id="pagePanel" tabindex="-1">
        <p class="eyebrow">Study-area layers</p>
        <h1 id="pageTitle">Layers</h1>
        <p class="intro">Explore the study area's imagery, land use and 3D buildings.</p>
        <label for="layerSelect">Layer</label>
        <select disabled="" id="layerSelect"></select>
        <nav aria-label="Layer slides" class="button-group layer-slides">
          <button disabled="" id="previous" type="button">Previous</button>
          <span id="counter"></span>
          <button disabled="" id="next" type="button">Next</button>
        </nav>
        <p id="description"></p>
        <div class="layer-legend" id="layerLegend" hidden>
          <p id="legendTitle"></p>
          <div class="legend-gradient" id="legendGradient"></div>
          <div class="legend-endpoints"><span id="legendMinimum"></span><span id="legendMaximum"></span></div>
          <a href="/data/elevation/study-area/ground-elevation.tif" download>Download elevation GeoTIFF</a>
        </div>
        <button id="resetView" type="button">Reset view</button>
        <p class="boundary-download"><a href="/downloads/study_area.geojson" download>Download study-area GeoJSON</a></p>
        <p class="status" id="status" role="status">Loading study area…</p>
        <p class="muted map-help">
          Drag to move · Scroll to zoom
          <br/>
          Ctrl + drag to tilt
        </p>
      </aside>
    </main>
    <script src="/src/main.js" type="module"></script>
  </body>
</html>
