<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schiehaven Noord | Urban morphology</title>
  </head>
  <body>
    <a class="skip-link" href="#pagePanel">Skip to morphology controls</a>
    <header class="topbar" id="projectHeader"></header>
    <main class="workspace">
      <section class="map-pane" aria-label="Urban morphology results over aerial imagery">
        <div class="map-canvas" id="morphologyMap" aria-label="Interactive morphology map"></div>
      </section>
      <aside class="app-panel morphology-panel" id="pagePanel" aria-labelledby="pageTitle" tabindex="-1">
        <p class="eyebrow">Urban analysis . Task 4.3</p>
        <h1 id="pageTitle">Urban morphology</h1>
        <p class="intro">Compare building density, sky visibility and green space across the existing site and both designs.</p>
        <div class="morphology-controls">
          <label for="scenarioSelect">Scenario</label>
          <select id="scenarioSelect" disabled></select>
          <p class="muted" id="scenarioDescription"></p>
          <label for="metricSelect">Map layer</label>
          <select id="metricSelect" disabled>
            <option value="svf">Sky-view factor · buildings + trees</option>
            <option value="svfb">Sky-view factor · buildings only</option>
            <option value="hw">Height-to-width proxy (H/W)</option>
          </select>
          <div class="opacity-heading">
            <label for="overlayOpacity">Overlay opacity</label>
            <output for="overlayOpacity" id="opacityValue">75%</output>
          </div>
          <input id="overlayOpacity" type="range" min="0" max="100" value="75" disabled />
          <div class="morphology-toggles">
            <label><input id="showOverlay" type="checkbox" checked disabled /> Show result overlay</label>
            <label><input id="showBuildings" type="checkbox" checked disabled /> Show buildings</label>
            <label><input id="show3d" type="checkbox" disabled /> 3D view</label>
            <label><input id="showBoundaries" type="checkbox" checked disabled /> Show boundaries</label>
          </div>
        </div>
        <section class="morphology-legend" aria-labelledby="legendTitle">
          <h2 id="legendTitle">Sky-view factor</h2>
          <div id="legendGradient" class="morphology-gradient"></div>
          <div id="legendTicks" class="morphology-ticks"></div>
          <p id="legendDescription" class="muted"></p>
        </section>
        <section aria-labelledby="indicatorsTitle">
          <h2 id="indicatorsTitle">Development-site indicators</h2>
          <div class="morphology-cards" id="indicatorCards"></div>
        </section>
        <p id="morphologyStatus" class="status error" role="alert" hidden></p>
        <section class="method-section" aria-labelledby="methodHeading">
          <h2 id="methodHeading">Method and Sources</h2>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/morphology.js"></script>
  </body>
</html>
